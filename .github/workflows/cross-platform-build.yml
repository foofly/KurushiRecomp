name: Cross-platform build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - name: Windows x64
            runner: windows-2022
            artifact: windows-x64
          - name: macOS Intel
            runner: macos-15-intel
            artifact: macos-intel
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: macos-arm64

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libpipewire-0.3-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev pkg-config

      - name: Install zip utility on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install zip --no-progress -y

      - name: Check out source and framework submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply tracked framework API patch
        shell: bash
        run: |
          if ! grep -q 'int psx_mod_set_post_aa(' psxrecomp/runtime/include/mod_plugins.h; then
            git -C psxrecomp apply --check "$GITHUB_WORKSPACE/psxrecomp-post-aa.patch"
            git -C psxrecomp apply "$GITHUB_WORKSPACE/psxrecomp-post-aa.patch"
          fi

      - name: Apply macOS setup packaging Bash compatibility patch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path("psxrecomp/tools/stage_setup_sdk.sh")
          source = script.read_text()
          old = '"${bios_args[@]}"'
          new = '"${bios_args[@]+"${bios_args[@]}"}"'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("could not find empty-array expansion in stage_setup_sdk.sh")
          script.write_text(source)
          PY

      - name: Check release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Release tag v${tag_version} must match VERSION (${project_version})." >&2
            exit 1
          fi

      - name: Fetch Windows emitter toolchain
        if: runner.os == 'Windows'
        uses: ./psxrecomp/.github/actions/fetch-toolchain
        with:
          artifact: windows-x64

      - name: Build local code generators
        uses: ./psxrecomp/.github/actions/build-emitters

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPSX_EXECUTION_PROFILE=REFERENCE
          -DPSX_GL_BATCH_IMPL=LLE
          -DPSX_ENABLE_VULKAN=OFF
          -DPSX_DEBUG_TOOLS=OFF
          -DPSX_SETUP_WIZARD=ON

      - name: Build runtime setup host
        run: cmake --build build-ci --target psx-runtime --parallel 2

      - name: Package self-contained setup host
        shell: bash
        run: |
          bash psxrecomp/tools/package_setup_host.sh \
            --root "$GITHUB_WORKSPACE" \
            --build-dir build-ci \
            --recompiler-build build-recompiler \
            --artifact "${{ matrix.artifact }}" \
            --zip-prefix kurushi \
            --exe-name Kurushi_Recompiled \
            --display-name "Kurushi Recompiled" \
            --disc-hint "your legally obtained USA I.Q. disc image" \
            --project-dir assets \
            --project-dir seeds \
            --project-file CMakeLists.txt \
            --project-file game.toml \
            --project-file VERSION \
            --project-file codegen_setup.c \
            --project-file codegen_setup.h \
            --project-file game_options.toml \
            --project-file LICENSE \
            --project-file THIRD_PARTY_NOTICES.md

      - name: Upload platform setup package
        uses: actions/upload-artifact@v4
        with:
          name: kurushi-${{ matrix.artifact }}-setup-package
          path: dist/kurushi-*-${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish platform downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: kurushi-*-setup-package
          path: release-assets
          merge-multiple: true

      - name: Verify packages and create checksums
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-assets/kurushi-*.zip)
          if [[ "${#packages[@]}" -ne 5 ]]; then
            echo "Expected five platform packages, found ${#packages[@]}" >&2
            ls -la release-assets >&2
            exit 1
          fi
          (cd release-assets && sha256sum kurushi-*.zip > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kurushi Recompiled ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/kurushi-*.zip
            release-assets/SHA256SUMS
